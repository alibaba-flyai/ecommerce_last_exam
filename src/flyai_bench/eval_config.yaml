# Global evaluation config
# Copy this file to eval_config.local.yaml and fill in real values

dataset:
  repo_id: FlyaiLab/ecommerce_last_exam
  config: travel          # travel / e_commerce
  split: test

docker:
  registry: ""
  platform: linux/amd64

agent:
  # Optional named Agent selected from the registrations below.
  # name: example-openai-agent
  # Command for the built-in container Agent when no registered Agent is selected.
  cmd: "python3 /app/mini_swe_agent.py"
  # Shared default for additional registered-Agent outputs below artifacts/.
  # A registration-specific output_paths value overrides this list.
  output_paths: []
  timeout_sec: 1800
  # Passed as LLM_* variables to the built-in or selected registered Agent.
  llm_base_url: "http://host.docker.internal:4000"
  llm_api_key: ""
  llm_model: "qwen3.7-plus"

# Register host-side custom Agents here. Relative paths resolve from this file.
agents:
  example-openai-agent:
    protocol: manifest-v1
    command:
      - python3
      - -m
      - flyai_bench.external_agent
      - --context
      - "{context}"
      - --max-turns
      - "30"
    cwd: .
    timeout_sec: 1800
    output_paths: []
    # Optional names of additional host environment variables to forward.
    pass_env: []

verifier:
  timeout_sec: 1200
  # Judge LLM config (injected into verifier environment variables)
  judge_base_url: "http://host.docker.internal:4000"
  judge_api_key: ""
  judge_model: "qwen3.7-plus"

runner:
  concurrency: 1
  output_dir: ./eval_results
  # Only run the first N (null = all)
  limit: null
  # Skip instances that already have a reward
  skip_done: true
